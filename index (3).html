<style>
:root{--bg:#f9f6ec;--ink:#1c1a17;--muted:#5d5850;--accent:#d9622b;--on-accent:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#1d1a16;--ink:#f4efe3;--muted:#b9b2a4;--accent:#d9622b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Roboto,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding:28px 20px 48px}
.brand{display:flex;align-items:center;gap:10px;font-size:.8rem;letter-spacing:.14em;color:var(--muted);font-weight:500;text-transform:uppercase}
.brand i{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block}
h1{font-size:clamp(2rem,7vw,3.4rem);line-height:1.1;margin:18px 0 28px;font-weight:500;letter-spacing:-.01em}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photos img{width:100%;height:auto;display:block;aspect-ratio:710/467;object-fit:cover}
.bottom{display:flex;justify-content:space-between;align-items:center;gap:24px;margin-top:28px;flex-wrap:wrap}
.note{margin:0;font-size:1.05rem;color:var(--muted);max-width:30ch}
.price{display:flex;align-items:center;justify-content:space-between;gap:28px;background:var(--accent);color:var(--on-accent);border-radius:18px;padding:22px 32px;min-width:min(100%,500px)}
.price span{font-weight:500;font-size:1rem}
.price strong{font-size:clamp(2rem,6vw,2.8rem);font-weight:700;white-space:nowrap}
@media (max-width:640px){
 .photos{grid-template-columns:1fr}
 .price{flex-direction:column;align-items:flex-start;gap:4px;padding:20px 22px;width:100%}
 .note{max-width:none}
}
</style>
