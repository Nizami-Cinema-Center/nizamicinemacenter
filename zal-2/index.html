<!DOCTYPE html>
<html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zal №2 – Nizami Kino Mərkəzi</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>:root{--bg:#f9f6ec;--ink:#1c1a17;--muted:#5d5850;--line:#ddd6c6;--accent:#d9622b}
@media (prefers-color-scheme:dark){:root{--bg:#1d1a16;--ink:#f4efe3;--muted:#b9b2a4;--line:#3a352d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Roboto,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding:28px 20px 48px}
.brand{display:flex;align-items:center;gap:10px;font-size:.8rem;letter-spacing:.14em;color:var(--muted);font-weight:500;text-transform:uppercase}
.brand i{width:9px;height:9px;border-radius:50%;background:var(--accent)}
h1{font-size:clamp(2rem,7vw,3.4rem);line-height:1.1;margin:18px 0 26px;font-weight:500;letter-spacing:-.01em}
.gallery{display:grid;gap:10px}
.gallery img{width:100%;height:auto;display:block;border-radius:12px;aspect-ratio:3/2;object-fit:cover}
.g1{grid-template-columns:1fr}.g1 img{aspect-ratio:auto;max-width:900px}
.g2{grid-template-columns:1fr 1fr}
.gm{grid-template-columns:1fr 1fr}
.gm img:first-child{grid-column:1/-1;aspect-ratio:16/10}
.gm.odd img:last-child{grid-column:1/-1;aspect-ratio:16/8}
@media (max-width:560px){.g2{grid-template-columns:1fr}}
.info{margin-top:28px;display:grid;gap:18px;max-width:720px}
.stats{margin:0;border-top:1px solid var(--line)}
.stats div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.stats dt{color:var(--muted)}.stats dd{margin:0;font-size:1.25rem;font-weight:500}
.eq h2{margin:0 0 6px;font-size:1.1rem;font-weight:700}
.eq p,.note{margin:0;font-size:1.05rem;color:var(--muted)}
.note.it{font-style:italic}
.prices{display:grid;gap:12px;margin-top:28px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.price{display:flex;align-items:center;justify-content:space-between;gap:20px;background:var(--accent);color:#fff;border-radius:18px;padding:22px 28px}
.price span{display:block;font-weight:500}
.price small{display:block;font-size:.9rem;font-style:italic;opacity:.92;margin-top:2px}
.price strong{font-size:clamp(1.9rem,6vw,2.7rem);font-weight:700;white-space:nowrap}
@media (max-width:480px){.price{flex-direction:column;align-items:flex-start;gap:6px;padding:18px 20px}}
</style></head><body><main class="wrap">
<div class="brand"><i></i>Nizami Kino Mərkəzi</div><h1>Zal №2</h1>
<div class="gallery gm odd"><img src="1.jpg" alt="Zal №2 – şəkil 1" width="729" height="614"><img src="2.jpg" alt="Zal №2 – şəkil 2" width="351" height="293" loading="lazy"><img src="3.jpg" alt="Zal №2 – şəkil 3" width="351" height="293" loading="lazy"><img src="4.jpg" alt="Zal №2 – şəkil 4" width="350" height="226" loading="lazy"><img src="5.jpg" alt="Zal №2 – şəkil 5" width="350" height="226" loading="lazy"><img src="6.jpg" alt="Zal №2 – şəkil 6" width="351" height="226" loading="lazy"></div>
<div class="info"><dl class="stats"><div><dt>Oturacaq sayı</dt><dd>80</dd></div><div><dt>Ekran ölçüsü</dt><dd>5.8 x 2.5</dd></div></dl><div class="eq"><h2>Təchizat:</h2><p>səs avadanlığı, istəyə görə bütün əlavə avadanlıq, ketrinq və s. təşkil edilə bilər</p></div></div>
<div class="prices"><div class="price"><div><span>Qiymət (ədv xaric)</span></div><strong>800 AZN</strong></div></div>
</main></body></html>
